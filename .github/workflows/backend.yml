name: Backend

# Deploys the backend (Cloudflare Worker + D1 database) at https://emotes-downloader.isdook.workers.dev
# whenever backend/ changes on main, or when started by hand (Actions → Backend → Run workflow).
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN    Cloudflare token with Workers Scripts: Edit and D1: Edit
#   DISCORD_BOT_TOKEN       Bot page of the "ISdook - emotes downloader" Discord app
#   DISCORD_CLIENT_SECRET   OAuth2 page of the same app
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 386862aca310d121c9694051718d8a85
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      PUBLIC_URL: https://emotes-downloader.isdook.workers.dev
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the secrets are set
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN DISCORD_BOT_TOKEN DISCORD_CLIENT_SECRET; do
            [ -n "${!s}" ] || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"; exit 1
          fi

      - name: Install wrangler
        run: npm install --no-audit --no-fund

      - name: Database (create once, then apply migrations)
        run: |
          find_db() {
            npx wrangler d1 list --json | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8"));const x=d.find(x=>x.name==="emotes-downloader");process.stdout.write(x?x.uuid:"")'
          }
          ID=$(find_db)
          if [ -z "$ID" ]; then
            npx wrangler d1 create emotes-downloader
            ID=$(find_db)
          fi
          [ -n "$ID" ] || { echo "::error::Couldn't create the D1 database"; exit 1; }
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          npx wrangler d1 migrations apply emotes-downloader --remote

      - name: Deploy the Worker
        run: npx wrangler deploy

      - name: Upload the secrets to the Worker
        run: |
          node -e 'require("fs").writeFileSync("secrets.json", JSON.stringify({DISCORD_BOT_TOKEN: process.env.DISCORD_BOT_TOKEN, DISCORD_CLIENT_SECRET: process.env.DISCORD_CLIENT_SECRET}))'
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Discord setup (commands, interactions URL, bot name and picture)
        run: node scripts/setup-discord.mjs
