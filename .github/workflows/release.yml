name: Release

# Push a tag like v1.0.1 (or publish a release on GitHub with that tag)
# -> builds the Windows .exe and attaches it to the GitHub Release.
# The app's updater downloads from the latest release.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches __version__
        shell: bash
        run: |
          V=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('emotes_downloader.py', encoding='utf-8').read()).group(1))")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match __version__ = $V in emotes_downloader.py"; exit 1
          fi

      - name: Build the .exe
        run: |
          pip install pillow pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name emotes-downloader emotes_downloader.py

      - name: Zip the Python version
        shell: pwsh
        run: Compress-Archive -Path emotes_downloader.py,run.bat,build_exe.bat,README.md,requirements.txt -DestinationPath emotes-downloader-python.zip

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/emotes-downloader.exe
            emotes_downloader.py
            emotes-downloader-python.zip
