name: Release

# Publish a release on GitHub (or push a tag) named like v1.2.0.
# This builds the portable .exe, the setup .exe and the Python zip, and attaches them to the release.
# The release notes come from CHANGELOG.md, and the app's auto-updater downloads from the latest release.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version and changelog
        id: meta
        shell: bash
        run: |
          V=$(python tools/release_notes.py version)
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match __version__ = $V in emotes_downloader.py"; exit 1
          fi
          python tools/release_notes.py notes "$V" > release_notes.md
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: pip install pillow customtkinter pyinstaller

      - name: Build portable .exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Emotes-Downloader-Portable --icon assets/icon.ico
          --add-data "assets;assets" --add-data "CHANGELOG.md;."
          --collect-data customtkinter --hidden-import PIL._tkinter_finder
          emotes_downloader.py

      - name: Build app folder for the installer
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name "Emotes Downloader" --icon assets/icon.ico
          --add-data "assets;assets" --add-data "CHANGELOG.md;."
          --collect-data customtkinter --hidden-import PIL._tkinter_finder
          --distpath dist/app --workpath build/app
          emotes_downloader.py

      - name: Build setup .exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.meta.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Zip the Python version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force py/assets | Out-Null
          Copy-Item emotes_downloader.py,run.bat,build_exe.bat,installer.iss,README.md,CHANGELOG.md,requirements.txt py/
          Copy-Item assets/* py/assets/
          Compress-Archive -Path py/* -DestinationPath Emotes-Downloader-Python.zip

      - uses: softprops/action-gh-release@v2
        with:
          name: Emotes Downloader v${{ steps.meta.outputs.version }}
          body_path: release_notes.md
          files: |
            dist/Emotes-Downloader-Portable.exe
            dist/Emotes-Downloader-Setup.exe
            emotes_downloader.py
            Emotes-Downloader-Python.zip
